<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Repository Viewer</title>
</head>
<body>
    <h1>Github Repository Viewer</h1>
    <form action="/repo" method="post">
        <label for="repo_url">Enter GitHub Repository URL:</label><br>
        <input type="text" id="repo_url" name="repo_url" required><br>
        <input type="submit" value="View Repository">
    </form>
</body>
</html>
