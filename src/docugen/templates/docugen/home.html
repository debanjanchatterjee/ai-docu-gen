<!DOCTYPE html>
<html>
<head>
    <title>AI DocuGen</title>
</head>
<body>
    <h1>Generate README from GitHub</h1>
    <form method="post">
        {% csrf_token %}
        <label for="url">GitHub Repo URL:</label>
        <input type="text" id="url" name="url" required>
        <button type="submit">Generate</button>
    </form>
    <!-- Output the generated README, if available -->
    {% if generated_readme %}
        <h2>Generated README:</h2>
        <pre>{{ generated_readme }}</pre>
    {% endif %}
</body>
</html>
